<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="96" fill="#0c0e12" />

  <!-- 3x3 Grid Lines -->
  <g stroke="#1e222e" stroke-width="12" stroke-linecap="round">
    <!-- Vertical Lines -->
    <line x1="176" y1="32" x2="176" y2="480" />
    <line x1="336" y1="32" x2="336" y2="480" />
    <!-- Horizontal Lines -->
    <line x1="32" y1="176" x2="480" y2="176" />
    <line x1="32" y1="336" x2="480" y2="336" />
  </g>

  <!-- Player X: Top-Left (1,1) -->
  <g stroke="#ff2d55" stroke-width="26" stroke-linecap="round">
    <line x1="60" y1="60" x2="140" y2="140" />
    <line x1="140" y1="60" x2="60" y2="140" />
  </g>

  <!-- Player X: Center (2,2) -->
  <g stroke="#ff2d55" stroke-width="26" stroke-linecap="round">
    <line x1="216" y1="216" x2="296" y2="296" />
    <line x1="296" y1="216" x2="216" y2="296" />
  </g>

  <!-- Player O: Top-Right (1,3) -->
  <circle cx="416" cy="100" r="42" fill="none" stroke="#0095ff" stroke-width="22" />

  <!-- Player O: Middle-Right (2,3) -->
  <circle cx="416" cy="256" r="42" fill="none" stroke="#0095ff" stroke-width="22" />
</svg>